<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electrical Safety Check</title>
<meta name="description" content="Issue and archive Electrical Safety Check reports under the Residential Tenancies Regulations 2021.">
<style>
/* Electrical Safety Check — hand-written stylesheet.
   Replaces the Tailwind build, so there is nothing to compile. Palette matches
   the certificate PDF so screen and print agree. */

:root {
  --ink: #1c2430;
  --muted: #5b6675;
  --line: #d5dbe3;
  --accent: #365f91;
  --accent-soft: #eef2f8;
  --pass: #1a7f4b;
  --fail: #b3261e;
  --amber: #b45309;
  --amber-soft: #fffbeb;
  --page: #f2f4f7;
  --radius: 8px;
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, ul, figure {
  margin: 0;
}

ul {
  padding: 0;
  list-style: none;
}

a {
  color: var(--accent);
}

/* ---------- Layout ---------- */

.site-header {
  border-bottom: 1px solid var(--line);
  background: #fff;
}

.site-header__inner,
.wrap {
  margin: 0 auto;
  max-width: 64rem;
  padding: 0 1.5rem;
}

.site-header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding-block: 1rem;
}

.brand {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  text-decoration: none;
}

.brand__name {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--accent);
}

.brand__sub {
  font-size: 0.75rem;
  color: var(--muted);
}

main.wrap {
  padding-block: 2rem;
}

.stack > * + * {
  margin-top: 1.5rem;
}

/* ---------- Cards and sections ---------- */

.card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  padding: 1.25rem;
  box-shadow: 0 1px 2px rgb(16 24 40 / 6%);
}

.card--pad {
  padding: 1.5rem;
}

.section-heading {
  margin-bottom: 0.75rem;
}

.section-heading__title {
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--accent);
}

.section-heading__intro {
  margin-top: 0.25rem;
  font-size: 0.75rem;
  color: var(--muted);
}

.section-heading__row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.75rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.5rem;
}

/* ---------- Forms ---------- */

.grid {
  display: grid;
  gap: 1rem;
}

@media (min-width: 40rem) {
  .grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .span-2 { grid-column: span 2; }
}

.field__label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  margin-bottom: 0.25rem;
}

.field__hint {
  margin-top: 0.25rem;
  font-size: 0.6875rem;
  color: var(--muted);
}

.field__error {
  margin-top: 0.25rem;
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--fail);
}

.required {
  color: var(--fail);
  margin-left: 0.125rem;
}

input[type='text'],
input[type='date'],
select,
textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  padding: 0.5rem 0.75rem;
  font: inherit;
  font-size: 0.875rem;
  color: inherit;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgb(54 95 145 / 18%);
}

input[aria-invalid='true'],
textarea[aria-invalid='true'] {
  border-color: var(--fail);
}

textarea {
  resize: vertical;
}

fieldset {
  border: 0;
  margin: 0;
  padding: 0;
}

legend {
  padding: 0;
  font-size: 0.8125rem;
  font-weight: 500;
  margin-bottom: 0.5rem;
}

.radio-row {
  display: flex;
  gap: 1rem;
}

.radio-row label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
}

.radio-row input {
  accent-color: var(--accent);
  width: 1rem;
  height: 1rem;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  padding: 0.5rem 1rem;
  font: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s ease, opacity 0.15s ease;
}

.btn:hover {
  background: var(--accent-soft);
}

.btn--primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.btn--primary:hover {
  background: var(--accent);
  opacity: 0.9;
}

.btn--small {
  padding: 0.25rem 0.5rem;
  font-size: 0.75rem;
}

.btn--submit {
  padding: 0.625rem 2rem;
  font-weight: 600;
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

/* ---------- Checklist ---------- */

.checklist {
  display: grid;
  gap: 0.375rem;
}

@media (min-width: 40rem) {
  .checklist { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.checklist__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  border-radius: 6px;
  padding: 0.375rem 0.5rem;
}

.checklist__row:hover {
  background: color-mix(in srgb, var(--accent-soft) 60%, transparent);
}

.checklist__label {
  font-size: 0.875rem;
}

.checklist__row[data-state='NOT_APPLICABLE'] .checklist__label {
  color: var(--muted);
  text-decoration: line-through;
}

.states {
  display: flex;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
}

.states button {
  border: 0;
  border-left: 1px solid var(--line);
  background: #fff;
  padding: 0.25rem 0.5rem;
  font: inherit;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
}

.states button:first-child {
  border-left: 0;
}

.states button:hover {
  background: var(--accent-soft);
}

.states button[aria-checked='true'] {
  color: #fff;
}

.states button[aria-checked='true'][data-state='INCLUDED'] {
  background: var(--pass);
}

.states button[aria-checked='true'][data-state='NOT_APPLICABLE'] {
  background: #64748b;
}

.states button[aria-checked='true'][data-state='NOT_INCLUDED'] {
  background: #f59e0b;
}

.tally {
  font-size: 0.75rem;
  color: var(--muted);
}

.tally[data-complete='true'] {
  color: var(--pass);
}

/* ---------- Tables ---------- */

.table-scroll {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

thead tr {
  border-bottom: 1px solid var(--line);
  text-align: left;
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}

th {
  padding: 0.5rem 0.75rem 0.5rem 0;
  font-weight: 600;
}

td {
  padding: 0.5rem 0.75rem 0.5rem 0;
  vertical-align: top;
}

tbody tr {
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}

tbody tr:last-child {
  border-bottom: 0;
}

.register-table {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: #fff;
  box-shadow: 0 1px 2px rgb(16 24 40 / 6%);
}

.register-table thead tr {
  background: var(--accent-soft);
}

.register-table th,
.register-table td {
  padding: 0.75rem 1rem;
}

.register-table td.numeric {
  white-space: nowrap;
}

.rcd-table th:nth-child(2),
.rcd-table th:nth-child(3) {
  width: 10rem;
}

.rcd-table th:last-child {
  width: 2.5rem;
}

/* ---------- Status ---------- */

.muted { color: var(--muted); }
.overdue { color: var(--fail); font-weight: 600; }

.badge {
  display: inline-block;
  flex-shrink: 0;
  border-radius: 4px;
  padding: 0.125rem 0.5rem;
  font-size: 0.75rem;
  font-weight: 500;
}

.badge[data-state='INCLUDED'] {
  background: color-mix(in srgb, var(--pass) 12%, #fff);
  color: var(--pass);
}

.badge[data-state='NOT_APPLICABLE'] {
  background: #f1f5f9;
  color: var(--muted);
}

.badge[data-state='NOT_INCLUDED'] {
  background: var(--amber-soft);
  color: var(--amber);
}

.alert {
  border: 1px solid color-mix(in srgb, var(--fail) 30%, transparent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--fail) 5%, #fff);
  padding: 1rem;
  font-size: 0.875rem;
  color: var(--fail);
}

.alert__title {
  font-weight: 600;
}

.alert__detail {
  margin-top: 0.25rem;
  font-size: 0.75rem;
}

.notice {
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: #fff;
  padding: 3rem;
  text-align: center;
  color: var(--muted);
  font-size: 0.875rem;
}

/* Shown whenever certificates are being kept in the browser rather than in a
   shared database, so nobody mistakes a demo for a record. */
.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
  border-radius: var(--radius);
  background: var(--amber-soft);
  padding: 0.625rem 0.875rem;
  font-size: 0.8125rem;
  color: var(--amber);
}

.banner strong {
  font-weight: 600;
}

/* ---------- Signature ---------- */

.signature-pad {
  height: 9rem;
  width: 100%;
  touch-action: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  cursor: crosshair;
}

.signature-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.25rem;
  font-size: 0.75rem;
  color: var(--muted);
}

/* ---------- Certificate header ---------- */

.certificate-header {
  text-align: center;
}

.certificate-header__regulation {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--accent);
}

.certificate-header__title {
  margin-top: 0.25rem;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent);
}

.certificate-header__preamble {
  margin-top: 1rem;
  text-align: left;
  font-size: 0.75rem;
  line-height: 1.6;
  color: var(--muted);
}

.page-title {
  font-size: 1.25rem;
  font-weight: 600;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
}

.toolbar form {
  display: flex;
  gap: 0.5rem;
}

.toolbar input {
  width: 18rem;
}

.actions {
  display: flex;
  gap: 0.5rem;
}

.summary-grid {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (min-width: 40rem) {
  .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.summary-grid dt {
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.summary-grid dd {
  margin: 0.125rem 0 0;
  font-size: 0.875rem;
  font-weight: 500;
}

.detail-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  font-size: 0.875rem;
  padding: 0.125rem 0;
}

.detail-list li[data-state='NOT_APPLICABLE'] span:first-child {
  color: var(--muted);
  text-decoration: line-through;
}

.prewrap {
  white-space: pre-wrap;
}

/* The register and certificate pages are routinely printed. Strip the chrome
   and let the body run edge to edge when they are. */
@media print {
  body { background: #fff; }
  .no-print { display: none !important; }
  .card { box-shadow: none; border-color: #ccc; break-inside: avoid; }
}

</style>
</head>

</main>

/**
 * Date helpers for the report.
 *
 * Every date on this form is a calendar date, never an instant, so they travel
 * as `YYYY-MM-DD` strings and are stored in Postgres `date` columns. Parsing
 * goes through UTC midnight so a user in Melbourne and a database in UTC agree
 * on which day a certificate was signed.
 */

const DATE_PATTERN = /^\d{4}-\d{2}-\d{2}$/

/** Parses `YYYY-MM-DD` to a UTC-midnight Date, or null if it is not a real date. */
function parseDateOnly(value) {
  if (typeof value !== 'string' || !DATE_PATTERN.test(value)) return null
  const [year, month, day] = value.split('-').map(Number)
  const date = new Date(Date.UTC(year, month - 1, day))
  const roundTripped =
    date.getUTCFullYear() === year &&
    date.getUTCMonth() === month - 1 &&
    date.getUTCDate() === day
  return roundTripped ? date : null
}

/** Formats a Date back to `YYYY-MM-DD` for date inputs. */
function toDateOnly(date) {
  return date.toISOString().slice(0, 10)
}

/** Today as `YYYY-MM-DD` in the viewer's local calendar. */
function todayDateOnly() {
  const now = new Date()
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60_000)
  return local.toISOString().slice(0, 10)
}

function addYears(value, years) {
  const date = parseDateOnly(value)
  if (!date) return ''
  date.setUTCFullYear(date.getUTCFullYear() + years)
  return toDateOnly(date)
}

/** Human-readable form used throughout the PDF and the register, e.g. 11 Feb 2026. */
function formatDisplayDate(date) {
  if (!date) return '—'
  const parsed = typeof date === 'string' ? parseDateOnly(date) : date
  if (!parsed) return '—'
  return new Intl.DateTimeFormat('en-AU', {
    day: '2-digit',
    month: 'short',
    year: 'numeric',
    timeZone: 'UTC',
  }).format(parsed)
}

/**
 * The Residential Tenancies Regulations 2021 require an electrical safety check
 * every two years, and smoke alarms to be tested every twelve months.
 */
const ELECTRICAL_CHECK_INTERVAL_YEARS = 2
const SMOKE_ALARM_INTERVAL_YEARS = 1

  return {
    DATE_PATTERN,
    parseDateOnly,
    toDateOnly,
    todayDateOnly,
    addYears,
    formatDisplayDate,
    ELECTRICAL_CHECK_INTERVAL_YEARS,
    SMOKE_ALARM_INTERVAL_YEARS,
  }
})

/**
 * Human-readable certificate reference, e.g. ESC-2026-000042.
 *
 * Derived from the record's serial and the year of inspection so it is stable,
 * sortable and unique without a second write after insert.
 */
function certificateReference(serial, inspectionDate) {
  const year = inspectionDate.getUTCFullYear()
  return `ESC-${year}-${String(serial).padStart(6, '0')}`
}

/** Filename for the exported PDF. Safe on every platform, and self-describing. */
function certificateFilename(reference, address) {
  const slug = address
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60)
  return slug ? `${reference}-${slug}.pdf` : `${reference}.pdf`
}

  return {
    certificateReference,
    certificateFilename,
  }
})

__def('validate.js', function (__req) {
/**
 * The single validation pass for a safety check.
 *
 * This is the vanilla-JS port of the Zod schema the Next.js version used. It is
 * deliberately kept free of DOM references so the same file can run inside a
 * Supabase Edge Function, where it becomes the copy a caller cannot skip.
 *
 * `validateSafetyCheck(payload)` returns either
 *   { ok: true,  values }                       — trimmed and normalised, or
 *   { ok: false, fieldErrors, formError }       — dotted path -> first message.
 *
 * Dotted paths match the field names used in the form markup, e.g.
 * `address`, `rcdTests.0.circuit`, `checklist.EXTENT.kitchen`.
 */

const { CHECKLIST, CHECKLIST_SECTIONS, ITEM_STATES, TEST_RESULTS } = __req('catalog.js')
const { DATE_PATTERN, parseDateOnly, todayDateOnly } = __req('dates.js')
const MAX_SIGNATURE_BYTES = 400_000
const MAX_RCD_ROWS = 60

/** Collects issues, keeping only the first message per path, as Zod did. */
class Issues {
  constructor() {
    this.fieldErrors = {}
  }

  add(path, message) {
    if (path && !(path in this.fieldErrors)) this.fieldErrors[path] = message
  }

  get count() {
    return Object.keys(this.fieldErrors).length
  }
}

}

/** Shared shape of every date field: right format, and a day that exists. */
function checkDate(issues, path, value, { optional = false } = {}) {
  const raw = asString(value)
  if (optional && raw === '') return null
  if (!DATE_PATTERN.test(raw)) {
    issues.add(path, 'Use the date picker (YYYY-MM-DD).')
    return null
  }
  const parsed = parseDateOnly(raw)
  if (!parsed) {
    issues.add(path, 'That date does not exist.')
    return null
  }
  return parsed
}

function checkText(issues, path, value, { min, max, minMessage, maxMessage }) {
  const trimmed = asString(value).trim()
  if (min !== undefined && trimmed.length < min) {
    issues.add(path, minMessage)
    return trimmed
  }
  if (max !== undefined && trimmed.length > max) {
    issues.add(path, maxMessage)
  }
  return trimmed

  const issues = new Issues()
  const input = payload && typeof payload === 'object' ? payload : {}

  // A. Installation address
  const address = checkText(issues, 'address', input.address, {
    min: 1,
    max: 500,
    minMessage: 'Enter the address of the installation.',
    maxMessage: 'Keep the address under 500 characters.',
  })

  const previousCheckDateRaw = asString(input.previousCheckDate)
  const previous = checkDate(issues, 'previousCheckDate', previousCheckDateRaw, { optional: true })

  // B, C and D checklists — every catalogue line must resolve to one of the
  // three states. The statutory form asks the electrician to tick, strike out,
  // or mark NI; leaving a line blank is not one of the options.
  const checklist = {}
  for (const section of CHECKLIST_SECTIONS) {
    checklist[section] = {}
    const definition = CHECKLIST.find((s) => s.section === section)
    const answers = (input.checklist && input.checklist[section]) || {}
    for (const item of definition.items) {
      const state = answers[item.key]
      if (!ITEM_STATES.includes(state)) {
        issues.add(`checklist.${section}.${item.key}`, 'Answer every line in this section.')
        continue
      }
      checklist[section][item.key] = state
    }
  }

  // D. RCD testing
  const rcdInput = Array.isArray(input.rcdTests) ? input.rcdTests : []
  if (rcdInput.length < 1) {
    issues.add('rcdTests', 'Record at least one RCD test.')
  } else if (rcdInput.length > MAX_RCD_ROWS) {
    issues.add('rcdTests', 'Sixty RCD rows is the practical limit for one report.')
  }

  const rcdTests = rcdInput.map((row, index) => {
    const source = row && typeof row === 'object' ? row : {}
    const circuit = checkText(issues, `rcdTests.${index}.circuit`, source.circuit, {
      min: 1,
      max: 200,
      minMessage: 'Name the circuit this RCD protects.',
      maxMessage: 'Keep the circuit name under 200 characters.',
    })
    for (const field of ['pushButtonTest', 'timeTest']) {
      if (!TEST_RESULTS.includes(source[field])) {
        issues.add(`rcdTests.${index}.${field}`, 'Choose a test result.')
      }

      circuit,
      pushButtonTest: source.pushButtonTest,
      timeTest: source.timeTest,
    }
  })

  // E. Smoke alarms
  const smokeAlarmsCompliant = input.smokeAlarmsCompliant
  if (typeof smokeAlarmsCompliant !== 'boolean') {
    issues.add('smokeAlarmsCompliant', 'Record whether the smoke alarms are compliant.')
  }
  const smokeDue = checkDate(issues, 'smokeAlarmDueDate', input.smokeAlarmDueDate)

  // F. Observations and recommendations
  const observations = asString(input.observations)
  if (observations.length > 5000) {
    issues.add('observations', 'Keep observations under 5000 characters.')
  }

  // G. Certification
  const electricianName = checkText(issues, 'electricianName', input.electricianName, {
    min: 1,
    max: 200,
    minMessage: 'Enter the name of the electrician who completed the check.',
    maxMessage: 'Keep the name under 200 characters.',
  })
  const licenceNumber = checkText(issues, 'licenceNumber', input.licenceNumber, {
    min: 1,
    max: 100,
    minMessage: 'Enter your licence or registration number.',
    maxMessage: 'Keep the licence number under 100 characters.',
  })

  const inspection = checkDate(issues, 'inspectionDate', input.inspectionDate)
  const nextDue = checkDate(issues, 'nextInspectionDue', input.nextInspectionDue)
  const signed = checkDate(issues, 'signedDate', input.signedDate)

  const signatureImage = asString(input.signatureImage)
  if (signatureImage.length === 0) {
    issues.add('signatureImage', 'Sign the certificate before submitting.')
  } else if (!signatureImage.startsWith('data:image/png;base64,')) {
    issues.add('signatureImage', 'The signature could not be read. Clear it and sign again.')
  } else if (signatureImage.length > MAX_SIGNATURE_BYTES) {
    issues.add('signatureImage', 'The signature image is too large. Clear it and sign again.')
  }

  // Cross-field rules. These run on whatever parsed cleanly above, so a bad
  // date reports its own problem rather than a confusing ordering error.
  const today = parseDateOnly(todayDateOnly())

  if (inspection && today && inspection.getTime() > today.getTime()) {
    issues.add('inspectionDate', 'The inspection date cannot be in the future.')
  }

  if (inspection && previous && previous.getTime() >= inspection.getTime()) {
    issues.add('previousCheckDate', 'The previous check must be earlier than this inspection.')
  }

  if (inspection && nextDue && nextDue.getTime() <= inspection.getTime()) {
    issues.add('nextInspectionDue', 'The next inspection must fall after this one.')
  }

  if (inspection && smokeDue && smokeDue.getTime() <= inspection.getTime()) {
    issues.add('smokeAlarmDueDate', 'The smoke alarm check is due after this inspection, not before it.')
  }

  if (inspection && smokeDue) {
    const twelveMonths = new Date(inspection)
    twelveMonths.setUTCFullYear(twelveMonths.getUTCFullYear() + 1)

    issues.add('signedDate', 'The certificate cannot be signed before the inspection took place.')

  // observations box exists for, so require it rather than letting a report go
  // out recording a failure and nothing else.
  const hasFailure = rcdTests.some(
    (test) => test.pushButtonTest === 'FAIL' || test.timeTest === 'FAIL',
  )
  if (hasFailure && observations.trim().length === 0) {
    issues.add('observations', 'An RCD failed. Record what was found and what action is recommended.')
  }
  if (smokeAlarmsCompliant === false && observations.trim().length === 0) {
    issues.add('observations', 'Smoke alarms are not compliant. Record what was found and what is recommended.')
  }

  if (issues.count > 0) {
    return {
      ok: false,
      fieldErrors: issues.fieldErrors,
      formError: 'Some answers need attention before this certificate can be issued.',
    }
  }

  return {
    ok: true,
    values: {
      address,
      previousCheckDate: previousCheckDateRaw || null,
      checklist,
      rcdTests,
      smokeAlarmsCompliant,
      smokeAlarmDueDate: asString(input.smokeAlarmDueDate),
      observations,
      electricianName,
      licenceNumber,
      inspectionDate: asString(input.inspectionDate),
      nextInspectionDue: asString(input.nextInspectionDue),
      signatureImage,
      signedDate: asString(input.signedDate),
    },
  }
}

  return {
    validateSafetyCheck,
  }
})

/**
 * Small DOM helpers.
 *
 * Everything user-entered — addresses, electrician names, observations — is set
 * as text nodes rather than assembled into HTML strings, so a stray angle
 * bracket in an address is just an angle bracket.
 */

/** el('div', { class: 'card' }, ['text', childNode]) */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag)

  for (const [key, value] of Object.entries(attrs)) {
    if (value == null || value === false) continue
    if (key === 'class') node.className = value
    else if (key === 'dataset') Object.assign(node.dataset, value)
    else if (key.startsWith('on') && typeof value === 'function') {
      node.addEventListener(key.slice(2).toLowerCase(), value)
    } else if (key === 'value') node.value = value
    else if (value === true) node.setAttribute(key, '')
    else node.setAttribute(key, String(value))
  }

  for (const child of [].concat(children)) {
    if (child == null || child === false) continue
    node.append(typeof child === 'string' || typeof child === 'number' ? String(child) : child)
  }

  return node
}

function qs(selector, scope = document) {
  return scope.querySelector(selector)
}

/** Replaces everything inside `parent`. */
function render(parent, ...children) {
  parent.replaceChildren(...children.flat().filter((c) => c != null && c !== false))
}

/**
 * True when running as the single-file build, which the bundler signals by
 * defining this flag before the app code.
 *
 * The three pages become three hash routes in one document, because a file
 * emailed to someone has to be one file. Everything else is identical.
 */
const SINGLE_FILE =
  typeof window !== 'undefined' && window.__ESC_SINGLE_FILE__ === true

/** Splits `#/check/<id>` or `#/?q=term` into a path and its parameters. */
function route() {
  const raw = window.location.hash.replace(/^#\/?/, '')
  const [path = '', query = ''] = raw.split('?')
  return { path, params: new URLSearchParams(query) }
}

/**
 * Reads a parameter from wherever this build keeps it — the query string for
 * the multi-page build, the hash for the single-file one.
 */
function param(name) {
  if (!SINGLE_FILE) return new URLSearchParams(window.location.search).get(name)

  const { path, params } = route()
  if (name === 'id') {
    const [section, id] = path.split('/')
    return section === 'check' && id ? decodeURIComponent(id) : null
  }
  return params.get(name)
}

/**
 * A link to one of the three views, in whichever form this build uses.
 *
 * `page` is 'register', 'new' or 'check'.
 */
function pageHref(page, { id, q } = {}) {
  if (SINGLE_FILE) {
    if (page === 'new') return '#/new'
    if (page === 'check') return `#/check/${encodeURIComponent(id)}`
    return q ? `#/?q=${encodeURIComponent(q)}` : '#/'
  }

  if (page === 'new') return 'new.html'
  if (page === 'check') return `check.html?id=${encodeURIComponent(id)}`
  return q ? `index.html?q=${encodeURIComponent(q)}` : 'index.html'
}

  return el('div', { class: 'notice' }, [el('p', {}, message), action])
}

 * The "this is not a record yet" banner.
 *
 * Shown on every page while certificates are kept in the browser. A demo that
 * looks exactly like the real thing is the one way this app could mislead
 * someone, so it says so plainly rather than quietly.

  const warning = el('span', { hidden: true })

  const node = el('div', { class: 'banner no-print' }, [
    el('strong', {}, 'Browser storage.'),
    ' Certificates are saved in this browser only — not shared with anyone, not ' +
    'backed up, and erased if site data is cleared.',
    warning,
  ])

  /**
   * Called once the store finds it cannot reach IndexedDB, which happens on a
   * page opened straight off the disk. Says which tier it landed on, because
   * "saved somewhere smaller" and "not saved at all" are very different things
   * to be told after issuing a certificate.

  node.noteFallback = (reason, persists) => {
    warning.hidden = false
    warning.replaceChildren(
      persists
        ? el('strong', {}, ' Using simple storage.')
        : el('strong', {}, ' Nothing is being saved.'),
      persists
        ? ` ${reason} Certificates are still kept, but only a handful fit. ` +
          'Opening the page through a web address rather than from a file lifts that.'
        : ` ${reason} Certificates will disappear when this tab closes. Open the ` +
          'page through a web address rather than from a file to keep them.',
    )
  }

 * Puts exactly one storage banner at the top of `main`, and returns it.
 *
 * The single-file build keeps one `main` across all three views, so each view
 * asking for a banner would otherwise stack them up.

  const existing = main.querySelector('.banner')

  const node = storageBanner()

    el('p', { class: 'alert__detail' }, message),
  ])

  return {
    el,
    qs,
    render,
    SINGLE_FILE,
    route,
    param,
    pageHref,
    notice,
    storageBanner,
    ensureStorageBanner,
    errorPanel,
  }
})

__def('store-local.js', function (__req) {
/**
 * Browser-local storage, for running the app with no database behind it.
 *
 * Three tiers, in order of preference:
 *
 *   IndexedDB      the normal case. No practical size limit.
 *   localStorage   when IndexedDB is refused, which is common for a page
 *                  opened straight off the disk as `file://`. Holds a few
 *                  certificates, not thousands: a signature PNG is a few
 *                  hundred kilobytes against a ~5 MB ceiling.
 *   memory         when both are refused. Dies with the tab.
 *
 * Certificates written here live in one browser on one machine. Nothing is
 * shared, backed up, or visible to anyone else — see `isDurable` below, which
 * the pages use to say so on screen.
 */

const { parseDateOnly } = __req('dates.js')
const DB_NAME = 'electrical-safety-check'
const DB_VERSION = 1
const STORE = 'certificates'
const META = 'meta'

const isDurable = false
const label = 'browser storage'

/**
 * Set once the first write or read discovers IndexedDB is unusable.
 *
 * A page opened straight off the disk as `file://` has an opaque origin, and
 * browsers variously restrict or refuse IndexedDB there. Private windows and
 * "block all site data" settings do the same. Rather than showing a broken app,
 * the store drops a tier and the banner reports which one it landed on —
 * `persists` is false only when even localStorage was refused.
 */
const fallback = { active: false, reason: '', persists: false }

/**
 * Second choice when IndexedDB is unreachable: localStorage, and plain memory
 * if even that is refused.
 *
 * localStorage holds a few certificates rather than thousands — a signature PNG
 * is a few hundred kilobytes against a ~5 MB ceiling — which is why it is not
 * the primary store. As a fallback it is worth having, because it means a file
 * opened straight off the disk still remembers what was issued.
 */
const shelf = (() => {
  const KEY = 'electrical-safety-check.certificates'
  const memory = []
  let usable = false

  try {
    localStorage.setItem(`${KEY}.probe`, '1')
    localStorage.removeItem(`${KEY}.probe`)
    usable = true
  } catch {
    usable = false
  }

  const toMemory = (rows) => {
    memory.length = 0
    memory.push(...rows)
  }

  return {
    get persists() {
      return usable
    },
    read() {
      if (!usable) return memory
      try {
        return JSON.parse(localStorage.getItem(KEY) || '[]')
      } catch {
        return []
      }
    },
    write(rows) {
      if (!usable) return toMemory(rows)
      try {
        localStorage.setItem(KEY, JSON.stringify(rows))
      } catch {
        // Out of quota, most likely. Drop to memory rather than losing the
        // write that is in flight.
        usable = false
        fallback.persists = false
        fallback.reason = 'This browser ran out of local storage space.'
        toMemory(rows)
      }
    },
  }
})()

let connection = null

function open() {
  if (connection) return connection

  connection = new Promise((resolve, reject) => {
    let request
    try {
      request = indexedDB.open(DB_NAME, DB_VERSION)
    } catch (error) {
      // Firefox throws outright on a file:// origin rather than failing async.
      reject(new Error(error.message || 'IndexedDB is not available on this page.'))
      return
    }

    request.onupgradeneeded = () => {
      const db = request.result
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: 'id' })
      }
      if (!db.objectStoreNames.contains(META)) {
        db.createObjectStore(META)
      }
    }

    request.onsuccess = () => resolve(request.result)
    request.onerror = () =>
      reject(new Error('This browser refused access to local storage.'))
    request.onblocked = () =>
      reject(new Error('Another tab is holding an older version of the database.'))
  })

  return connection
}

/**
 * Resolves to a database, or null once the fallback has taken over.
 *
 * The first failure is recorded and never retried, so a page opened from disk
 * does not attempt a doomed connection on every keystroke.
 */
async function tryOpen() {
  if (fallback.active) return null

  if (typeof indexedDB === 'undefined') {
    return dropTier('This browser has no IndexedDB.')
  }

  try {
    return await open()
  } catch (error) {
    return dropTier(error.message)
  }
}

/**
 * Records why IndexedDB is out and which tier took over.
 *
 * Both callers must go through here: setting `active` without `persists` once
 * made a browser that had no IndexedDB but a perfectly good localStorage claim
 * it was saving nothing.
 */
function dropTier(reason) {
  fallback.active = true
  fallback.reason = reason
  fallback.persists = shelf.persists
  return null
}

/** Wraps an IndexedDB request in a promise. */
function wrap(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error || new Error('Local storage request failed.'))
  })
}

/** Always true — there is nothing to configure. */
function isConfigured() {
  return true
}

/**
 * Writes a certificate and returns its id.
 *
 * The serial is allocated inside the same transaction as the insert, so two
 * certificates issued in quick succession cannot collide on a reference.
 */
async function createSafetyCheck(values) {
  const db = await tryOpen()

  if (!db) {
    const rows = shelf.read()
    const serial = rows.reduce((max, row) => Math.max(max, row.serial || 0), 0) + 1
    const id = crypto.randomUUID()
    rows.push({ ...values, id, serial, createdAt: new Date().toISOString() })
    shelf.write(rows)
    return id
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE, META], 'readwrite')
    const meta = tx.objectStore(META)
    const store = tx.objectStore(STORE)
    let id

    const read = meta.get('serial')
    read.onsuccess = () => {
      const serial = (read.result || 0) + 1
      meta.put(serial, 'serial')

      id = crypto.randomUUID()
      store.put({
        ...values,
        id,
        serial,
        createdAt: new Date().toISOString(),
      })
    }

    tx.oncomplete = () => resolve(id)
    tx.onerror = () =>
      reject(new Error(tx.error?.message || 'The certificate could not be written to this browser.'))
    tx.onabort = () =>
      reject(new Error(tx.error?.message || 'The write was aborted before anything was stored.'))
  })
}

/** Register rows, newest inspection first. `search` matches address, name or licence. */
async function listSafetyChecks(search) {
  const db = await tryOpen()
  const rows = db
    ? await wrap(db.transaction(STORE, 'readonly').objectStore(STORE).getAll())
    : shelf.read()

  const term = (search || '').trim().toLowerCase()
  const matches = term
    ? rows.filter((row) =>
        [row.address, row.electricianName, row.licenceNumber]
          .some((value) => String(value || '').toLowerCase().includes(term)),
      )
    : rows

  return matches
    .sort((a, b) => b.inspectionDate.localeCompare(a.inspectionDate))
    .slice(0, 100)
    .map(toSummary)
}

/** Everything the certificate page and the PDF need. */
async function getSafetyCheck(id) {
  const db = await tryOpen()
  const row = db
    ? await wrap(db.transaction(STORE, 'readonly').objectStore(STORE).get(id))
    : shelf.read().find((candidate) => candidate.id === id)
  return row ? toRecord(row) : null
}

/** Used by the register's sample-data affordance. */
async function count() {
  const db = await tryOpen()
  if (!db) return shelf.read().length
  return wrap(db.transaction(STORE, 'readonly').objectStore(STORE).count())
}

function toSummary(row) {
  return {
    id: row.id,
    serial: row.serial,
    address: row.address,
    electricianName: row.electricianName,
    inspectionDate: parseDateOnly(row.inspectionDate),
    nextInspectionDue: parseDateOnly(row.nextInspectionDue),
    smokeAlarmsCompliant: row.smokeAlarmsCompliant,
  }
}

/** Dates are stored as YYYY-MM-DD strings, exactly as the Postgres path stores them. */
function toRecord(row) {
  return {
    id: row.id,
    serial: row.serial,
    address: row.address,
    previousCheckDate: row.previousCheckDate ? parseDateOnly(row.previousCheckDate) : null,
    checklist: row.checklist,
    rcdTests: row.rcdTests,
    smokeAlarmsCompliant: row.smokeAlarmsCompliant,
    smokeAlarmDueDate: parseDateOnly(row.smokeAlarmDueDate),
    observations: row.observations,
    electricianName: row.electricianName,
    licenceNumber: row.licenceNumber,
    inspectionDate: parseDateOnly(row.inspectionDate),
    nextInspectionDue: parseDateOnly(row.nextInspectionDue),
    signatureImage: row.signatureImage,
    signedDate: parseDateOnly(row.signedDate),
  }
}

/** Everything stored here, as a JSON string — the only backup this mode has. */
async function exportAll() {
  const db = await tryOpen()
  const rows = db
    ? await wrap(db.transaction(STORE, 'readonly').objectStore(STORE).getAll())
    : shelf.read()
  return JSON.stringify({ exported: new Date().toISOString(), certificates: rows }, null, 2)
}

  return {
    isDurable,
    label,
    fallback,
    isConfigured,

__def('db.js', function (__req) {
/**
 * Picks the storage backend and hands the pages one interface.
 *
 * `STORAGE` in config.js decides. Both backends expose the same three
 * functions and return the same shapes, so no page knows the difference:
 *
 *   store-local.js     IndexedDB in the visitor's browser. No setup.
 *   store-supabase.js  Postgres. Needs a project and the schema applied.
 *
 * The Supabase module is imported only when it is selected, so a local build
 * never fetches the client library from a CDN.
 */

const { STORAGE } = __req('config.js')
const local = __req('store-local.js')
const backend = STORAGE === 'supabase' ? __req('store-supabase.js') : local

/** Whether writes survive leaving this browser. False for the local backend. */
const isDurable = backend.isDurable

/** Human-readable name of the backend in use, for the on-screen banner. */
const storageLabel = backend.label

function isConfigured() {
  return backend.isConfigured()
}

function createSafetyCheck(values) {
  return backend.createSafetyCheck(values)
}

function listSafetyChecks(search) {
  return backend.listSafetyChecks(search)
}

function getSafetyCheck(id) {
  return backend.getSafetyCheck(id)
}

/** Only present on the local backend; the register uses it to offer a sample. */
const exportAll = local.exportAll

/**
 * Live view of whether the local store had to fall back to memory. Meaningless
 * for the Supabase backend, where it stays inactive.
 */
const storageFallback = local.fallback

  return {
    isDurable,
    storageLabel,
    isConfigured,
    createSafetyCheck,
    listSafetyChecks,
    getSafetyCheck,
    exportAll,
    storageFallback,
  }
})

__def('pdf.js', function (__req) {
/**
 * The certificate PDF, drawn with pdf-lib in the browser.
 *
 * pdf-lib has no layout engine — no flexbox, no text wrapping, no page breaks —
 * so this file provides the small amount of layout the certificate needs: a
 * cursor that measures down from the top of the page, word wrapping against a
 * measured font, and an `ensure()` that starts a new page before a block would
 * run off the bottom.
 *
 * Helvetica is one of the fourteen fonts built into the PDF format, so nothing
 * is fetched or embedded at render time and the file stays small.
 *
 * Tick marks are vector paths rather than symbol-font glyphs. The original
 * TCPDF export used ZapfDingbats characters, which meant the checked state
 * lived in a font rather than in the page content — it did not survive text
 * extraction and rendered inconsistently across viewers.
 */

const { CERTIFICATION_DECLARATION, CHECKLIST, REGULATION_PREAMBLE, SMOKE_ALARM_NOTE, TEST_RESULT_LABELS } = __req('catalog.js')
const { ORGANISATION_NAME } = __req('config.js')
const { formatDisplayDate } = __req('dates.js')
const { certificateFilename, certificateReference } = __req('reference.js')
const { PDFDocument, StandardFonts, rgb } = window.PDFLib

// A4 in points.
const PAGE_W = 595.28
const PAGE_H = 841.89

const MARGIN_X = 42
const CONTENT_TOP = 64
const CONTENT_BOTTOM = PAGE_H - 56
const CONTENT_W = PAGE_W - MARGIN_X * 2

const palette = {
  ink: hex('#1c2430'),
  muted: hex('#5b6675'),
  line: hex('#c9d2dd'),
  accent: hex('#365f91'),
  accentSoft: hex('#eef2f8'),
  pass: hex('#1a7f4b'),
  fail: hex('#b3261e'),
  failSoft: hex('#fdf2f1'),
  white: hex('#ffffff'),
}

function hex(value) {
  const n = parseInt(value.slice(1), 16)
  return rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

/**
 * A page with a top-down cursor.
 *
 * pdf-lib measures from the bottom-left, which is awkward for a document that
 * flows downward, so `y` here is distance from the top of the page and every
 * draw call converts on the way out.
 */
class Layout {
  constructor(doc, fonts) {
    this.doc = doc
    this.regular = fonts.regular
    this.bold = fonts.bold
    this.pages = []
    this.newPage()
  }

  newPage() {
    this.page = this.doc.addPage([PAGE_W, PAGE_H])
    this.pages.push(this.page)
    this.y = CONTENT_TOP
    return this.page
  }

  /** Starts a new page if `height` more would run past the bottom margin. */
  ensure(height) {
    if (this.y + height > CONTENT_BOTTOM) this.newPage()
  }

  font(bold) {
    return bold ? this.bold : this.regular
  }

  /** Splits `text` into lines that fit `maxWidth`, honouring existing newlines. */
  wrap(text, { size, bold = false, maxWidth }) {
    const font = this.font(bold)
    const lines = []
    for (const paragraph of String(text).split('\n')) {
      const words = paragraph.split(/\s+/).filter(Boolean)
      if (words.length === 0) {
        lines.push('')
        continue
      }
      let current = words[0]
      for (const word of words.slice(1)) {
        const candidate = `${current} ${word}`
        if (font.widthOfTextAtSize(candidate, size) <= maxWidth) {
          current = candidate
        } else {
          lines.push(current)
          current = word
        }
      }
      lines.push(current)
    }
    return lines
  }

  /** Height a block of text will occupy, without drawing it. */
  heightOf(text, { size, bold = false, maxWidth, lineHeight = 1.45 }) {
    return this.wrap(text, { size, bold, maxWidth }).length * size * lineHeight
  }

  /**
   * Draws wrapped text at the cursor (or at `top`, leaving the cursor alone) and
   * returns the height used.
   */
  text(text, options) {
    const {
      size = 8.5,
      bold = false,
      color = palette.ink,
      maxWidth = CONTENT_W,
      x = MARGIN_X,
      top = null,
      lineHeight = 1.45,
      align = 'left',
      advance = true,
    } = options || {}

    const font = this.font(bold)
    const lines = this.wrap(text, { size, bold, maxWidth })
    const step = size * lineHeight
    // Sits the glyph box in the middle of the line box.
    const baselineOffset = (step - size) / 2 + size * 0.72
    let cursor = top === null ? this.y : top

    for (const line of lines) {
      let drawX = x
      if (align !== 'left') {
        const width = font.widthOfTextAtSize(line, size)
        drawX = align === 'center' ? x + (maxWidth - width) / 2 : x + maxWidth - width
      }
      this.page.drawText(line, {
        x: drawX,
        y: PAGE_H - cursor - baselineOffset,
        size,
        font,
        color,
      })
      cursor += step
    }

    const used = lines.length * step
    if (advance && top === null) this.y += used
    return used
  }

  rect(x, top, width, height, options = {}) {
    this.page.drawRectangle({
      x,
      y: PAGE_H - top - height,
      width,
      height,
      ...(options.fill ? { color: options.fill } : {}),
      ...(options.border
        ? { borderColor: options.border, borderWidth: options.borderWidth ?? 0.75 }
        : {}),
    })
  }

  line(x1, top, x2, options = {}) {
    this.page.drawLine({
      start: { x: x1, y: PAGE_H - top },
      end: { x: x2, y: PAGE_H - top },
      thickness: options.thickness ?? 0.75,
      color: options.color ?? palette.line,
    })
  }

  /** SVG paths are drawn in a top-down space anchored at (x, top). */
  svg(path, x, top, options = {}) {
    this.page.drawSvgPath(path, {
      x,
      y: PAGE_H - top,
      ...(options.fill ? { color: options.fill } : { color: undefined }),
      ...(options.stroke ? { borderColor: options.stroke } : {}),
      ...(options.strokeWidth ? { borderWidth: options.strokeWidth } : {}),
    })
  }
}

// ---------------------------------------------------------------------------
// Marks
// ---------------------------------------------------------------------------

const BOX = 8

function checkedMark(l, x, top) {
  l.rect(x + 0.4, top + 0.4, 7.2, 7.2, { fill: palette.pass })
  l.svg('M2 4.2 L3.4 5.7 L6.1 2.5', x, top, {
    stroke: palette.white,
    strokeWidth: 1.2,
  })
}

function notApplicableMark(l, x, top) {
  l.rect(x + 0.4, top + 0.4, 7.2, 7.2, { fill: palette.white, border: palette.line, borderWidth: 0.7 })
  l.svg('M1.6 6.4 L6.4 1.6', x, top, { stroke: palette.muted, strokeWidth: 0.9 })
}

function notIncludedMark(l, x, top) {
  l.rect(x + 0.4, top + 0.4, 7.2, 7.2, { fill: palette.white, border: palette.line, borderWidth: 0.7 })
}

function stateMark(l, x, top, state) {
  if (state === 'INCLUDED') checkedMark(l, x, top)
  else if (state === 'NOT_APPLICABLE') notApplicableMark(l, x, top)
  else notIncludedMark(l, x, top)
}

function radioMark(l, x, top, selected) {
  l.page.drawCircle({
    x: x + 4,
    y: PAGE_H - top - 4,
    size: 3.4,
    color: palette.white,
    borderColor: selected ? palette.pass : palette.line,
    borderWidth: 0.8,
  })
  if (selected) {
    l.svg('M2.2 4.1 L3.5 5.4 L5.9 2.6', x, top, {
      stroke: palette.pass,
      strokeWidth: 1.1,
    })
  }
}

// ---------------------------------------------------------------------------
// Blocks
// ---------------------------------------------------------------------------

/**
 * Space a heading must have beneath it before it is allowed to sit on a page.
 * Without this a heading strands at the foot of one page with its content
 * overleaf — the case `minPresenceAhead` covered in the react-pdf version.
 */
const KEEP_WITH_NEXT = 96

function sectionHeading(l, text) {
  const height = 17
  l.ensure(height + 20 + KEEP_WITH_NEXT)
  l.y += 14
  l.rect(MARGIN_X, l.y, CONTENT_W, height, { fill: palette.accentSoft })
  l.rect(MARGIN_X, l.y, 3, height, { fill: palette.accent })
  l.text(text.toUpperCase(), {
    size: 9.5,
    bold: true,
    color: palette.accent,
    x: MARGIN_X + 7,
    maxWidth: CONTENT_W - 14,
    top: l.y + 3.5,
  })
  l.y += height + 6
}

function subHeading(l, text) {
  l.ensure(30 + KEEP_WITH_NEXT)
  l.y += 8
  l.text(text, { size: 8.5, bold: true })
  l.y += 4
}

/** A label above a value with a hairline rule under it, as on the printed form. */
function labelledValue(l, x, top, width, label, value) {
  l.text(label.toUpperCase(), {
    size: 6.5,
    color: palette.muted,
    x,
    maxWidth: width,
    top,
  })
  const valueTop = top + 6.5 * 1.45
  const height = l.text(value, { size: 9, x, maxWidth: width, top: valueTop })
  l.line(x, valueTop + height + 3, x + width)
  return valueTop + height + 3 - top
}

function fieldRow(l, fields) {
  const gap = 14
  const totalFlex = fields.reduce((sum, f) => sum + (f.flex || 1), 0)
  const usable = CONTENT_W - gap * (fields.length - 1)

  // Measure first so the whole row moves to the next page together.
  let tallest = 0
  let x = MARGIN_X
  const placed = fields.map((field) => {
    const width = (usable * (field.flex || 1)) / totalFlex
    const entry = { ...field, x, width }
    x += width + gap
    const height = 6.5 * 1.45 + l.heightOf(field.value, { size: 9, maxWidth: width }) + 3
    tallest = Math.max(tallest, height)
    return entry
  })

  l.ensure(tallest + 6)
  for (const field of placed) {
    labelledValue(l, field.x, l.y, field.width, field.label, field.value)
  }
  l.y += tallest + 6
}

function legend(l) {
  const entries = [
    ['INCLUDED', 'Included in the safety check'],
    ['NOT_APPLICABLE', 'Not applicable to this installation'],
    ['NOT_INCLUDED', 'NI — not included in the safety check'],
  ]
  l.ensure(14)
  let x = MARGIN_X
  for (const [state, label] of entries) {
    stateMark(l, x, l.y + 1, state)
    l.text(label, { size: 6.5, color: palette.muted, x: x + BOX + 3, maxWidth: 200, top: l.y + 1 })
    x += BOX + 3 + l.regular.widthOfTextAtSize(label, 6.5) + 14
  }
  l.y += 14
}

/** One statutory checklist, in two columns like the printed form. */
function checklistBlock(l, section, states, { showLetter, showLegend }) {
  const gap = 16
  const colWidth = (CONTENT_W - gap) / 2
  const labelWidth = colWidth - BOX - 4
  const half = Math.ceil(section.items.length / 2)
  const columns = [section.items.slice(0, half), section.items.slice(half)]

  const rowHeight = (item) =>
    Math.max(BOX, l.heightOf(item.label, { size: 8, maxWidth: labelWidth })) + 2.5

  const columnHeights = columns.map((column) =>
    column.reduce((sum, item) => sum + rowHeight(item), 0),
  )
  const gridHeight = Math.max(...columnHeights)

  // The heading, its wording and the start of the list are measured together
  // and moved as one, so a section never opens at the foot of a page with its
  // items overleaf.
  const preamble =
    (showLetter ? 14 + 17 + 6 : 0) +
    (section.intro ? l.heightOf(section.intro, { size: 7, maxWidth: CONTENT_W }) + 6 : 0) +
    (section.subtitle ? 8 + 8.5 * 1.45 + 4 : 0) +
    (showLegend ? 14 : 0)

  // The tallest checklist is 20 items over two columns, so a whole block always
  // fits on a fresh page and can be moved rather than split.
  l.ensure(preamble + gridHeight)

  if (showLetter) sectionHeading(l, `${section.letter}. ${section.title}`)
  if (section.intro) {
    l.text(section.intro, { size: 7, color: palette.muted })
    l.y += 6
  }
  if (section.subtitle) subHeading(l, section.subtitle)
  if (showLegend) legend(l)

  const blockTop = l.y
  columns.forEach((column, index) => {
    const x = MARGIN_X + index * (colWidth + gap)
    let top = blockTop
    for (const item of column) {
      const state = states[item.key]
      stateMark(l, x, top + 1.5, state)
      l.text(item.label, {
        size: 8,
        x: x + BOX + 4,
        maxWidth: labelWidth,
        top,
        color: state === 'NOT_APPLICABLE' ? palette.muted : palette.ink,
      })
      if (state === 'NOT_APPLICABLE') {
        // pdf-lib has no text-decoration, so the strike-through is a rule drawn
        // across the measured width of the label.
        const width = Math.min(l.regular.widthOfTextAtSize(item.label, 8), labelWidth)
        l.line(x + BOX + 4, top + 5.8, x + BOX + 4 + width, { thickness: 0.5, color: palette.muted })
      }
      if (state === 'NOT_INCLUDED') {
        const width = l.regular.widthOfTextAtSize(item.label, 8)
        l.text('NI', {
          size: 6,
          bold: true,
          color: palette.muted,
          x: Math.min(x + BOX + 4 + width + 4, x + colWidth - 10),
          maxWidth: 12,
          top: top + 0.5,
        })
      }
      top += rowHeight(item)
    }
  })

  l.y = blockTop + Math.max(...columnHeights)
}

function rcdTable(l, tests) {
  subHeading(l, 'RCD (residual current device / safety switch) testing')

  const resultWidth = 110
  const circuitWidth = CONTENT_W - resultWidth * 2
  const headerHeight = 15

  l.ensure(headerHeight + 18)
  const tableTop = l.y
  l.rect(MARGIN_X, l.y, CONTENT_W, headerHeight, { fill: palette.accentSoft })
  const headers = [
    ['Circuit protected', MARGIN_X + 6, circuitWidth],
    ['Push button test', MARGIN_X + circuitWidth + 6, resultWidth],
    ['Time test', MARGIN_X + circuitWidth + resultWidth + 6, resultWidth],
  ]
  for (const [label, x, width] of headers) {
    l.text(label.toUpperCase(), {
      size: 6.5,
      bold: true,
      color: palette.muted,
      x,
      maxWidth: width - 12,
      top: l.y + 4,
    })
  }
  l.y += headerHeight

  let sectionTop = tableTop
  for (const test of tests) {
    const circuitHeight = l.heightOf(test.circuit, { size: 8, maxWidth: circuitWidth - 12 })
    const rowHeight = Math.max(circuitHeight, 8 * 1.45) + 8

    if (l.y + rowHeight > CONTENT_BOTTOM) {
      // Close the border around what has been drawn, then carry on overleaf.
      l.rect(MARGIN_X, sectionTop, CONTENT_W, l.y - sectionTop, { border: palette.line })
      l.newPage()
      sectionTop = l.y
    }

    l.line(MARGIN_X, l.y, MARGIN_X + CONTENT_W)
    l.text(test.circuit, {
      size: 8,
      x: MARGIN_X + 6,
      maxWidth: circuitWidth - 12,
      top: l.y + 4,
    })

    const results = [
      [test.pushButtonTest, MARGIN_X + circuitWidth + 6],
      [test.timeTest, MARGIN_X + circuitWidth + resultWidth + 6],
    ]
    for (const [result, x] of results) {
      l.text(TEST_RESULT_LABELS[result], {
        size: 8,
        bold: result !== 'NA',
        color: result === 'PASS' ? palette.pass : result === 'FAIL' ? palette.fail : palette.muted,
        x,
        maxWidth: resultWidth - 12,
        top: l.y + 4,
      })
    }
    l.y += rowHeight
  }

  l.rect(MARGIN_X, sectionTop, CONTENT_W, l.y - sectionTop, { border: palette.line })
}

function failCallout(l, count) {
  const message = `${count} RCD test${count === 1 ? '' : 's'} failed. See observations and recommendations below.`
  const height = l.heightOf(message, { size: 7.5, bold: true, maxWidth: CONTENT_W - 14 }) + 14
  l.ensure(height + 8)
  l.y += 8
  l.rect(MARGIN_X, l.y, CONTENT_W, height, { fill: palette.failSoft, border: palette.fail })
  l.text(message, {
    size: 7.5,
    bold: true,
    color: palette.fail,
    x: MARGIN_X + 7,
    maxWidth: CONTENT_W - 14,
    top: l.y + 7,
  })
  l.y += height
}

function smokeAlarms(l, data) {
  sectionHeading(l, 'E. Smoke alarms')

  const gap = 14
  const leftWidth = ((CONTENT_W - gap) * 2) / 3
  const rightX = MARGIN_X + leftWidth + gap
  const rightWidth = CONTENT_W - leftWidth - gap

  const statement =
    'All smoke alarms are correctly installed and in working condition, and have been tested according to the ' +
    "manufacturer's instructions."
  const statementHeight = l.heightOf(statement, { size: 8, maxWidth: leftWidth })

  l.ensure(statementHeight + 40)
  const top = l.y

  l.text(statement, { size: 8, maxWidth: leftWidth, top })
  const radioTop = top + statementHeight + 4
  radioMark(l, MARGIN_X, radioTop, data.smokeAlarmsCompliant)
  l.text('Yes', { size: 8, x: MARGIN_X + BOX + 4, maxWidth: 30, top: radioTop })
  radioMark(l, MARGIN_X + 50, radioTop, !data.smokeAlarmsCompliant)
  l.text('No', { size: 8, x: MARGIN_X + 50 + BOX + 4, maxWidth: 30, top: radioTop })

  const usedRight = labelledValue(
    l,
    rightX,
    top,
    rightWidth,
    'Next smoke alarm check due by',
    formatDisplayDate(data.smokeAlarmDueDate),
  )
  l.text(SMOKE_ALARM_NOTE, {
    size: 6.5,
    color: palette.muted,
    x: rightX,
    maxWidth: rightWidth,
    top: top + usedRight + 4,
  })

  l.y = top + Math.max(statementHeight + 4 + BOX + 6, usedRight + 20) + 6
}

function observations(l, text) {
  sectionHeading(l, 'F. Observations and recommendations for any actions to be taken')
  const body =
    text.trim() || 'No observations or recommendations were recorded for this installation.'
  const height = Math.max(54, l.heightOf(body, { size: 8, maxWidth: CONTENT_W - 16 }) + 16)
  l.ensure(height)
  l.rect(MARGIN_X, l.y, CONTENT_W, height, { border: palette.line })
  l.text(body, { size: 8, x: MARGIN_X + 8, maxWidth: CONTENT_W - 16, top: l.y + 8 })
  l.y += height
}

async function certification(l, data, signature) {
  sectionHeading(l, 'G. Electrical safety check certification')

  fieldRow(l, [
    { label: 'Safety check completed by', value: data.electricianName },
    { label: 'Licence / registration number', value: data.licenceNumber },
  ])
  fieldRow(l, [
    { label: 'Inspection date', value: formatDisplayDate(data.inspectionDate) },
    { label: 'Next inspection due by', value: formatDisplayDate(data.nextInspectionDue) },
  ])

  l.y += 4
  const declarationHeight = l.heightOf(CERTIFICATION_DECLARATION, { size: 7.5, maxWidth: CONTENT_W })
  l.ensure(declarationHeight + 90)
  l.text(CERTIFICATION_DECLARATION, { size: 7.5, color: palette.muted })
  l.y += 12

  const signatureHeight = 46
  const dateWidth = 150
  const signatureWidth = CONTENT_W - dateWidth - 20

  l.ensure(signatureHeight + 24)
  const top = l.y

  if (signature) {
    // Fit inside the box without distortion, anchored left as on the form.
    const scale = Math.min(signatureWidth / signature.width, signatureHeight / signature.height)
    l.page.drawImage(signature, {
      x: MARGIN_X,
      y: PAGE_H - top - signatureHeight,
      width: signature.width * scale,
      height: signature.height * scale,
    })
  }

  const ruleTop = top + signatureHeight + 2
  l.line(MARGIN_X, ruleTop, MARGIN_X + signatureWidth, { color: palette.ink })
  l.text(`SIGNATURE — ${data.electricianName}`.toUpperCase(), {
    size: 6.5,

/** Renders a stored record to PDF bytes. */
async function renderCertificate(record) {
  const reference = certificateReference(record.serial, record.inspectionDate)
  const data = { ...record, reference, organisation: ORGANISATION_NAME }

  const doc = await PDFDocument.create()
  doc.setTitle(`Electrical Safety Check ${reference}`)
  doc.setAuthor(ORGANISATION_NAME)
  doc.setSubject(`Electrical Safety Check – Report for ${record.address}`)
  doc.setKeywords([
    'electrical safety check',
    'Residential Tenancies Regulations 2021',
    'AS/NZS 3019',
  ])
  doc.setCreator(ORGANISATION_NAME)
  doc.setProducer(ORGANISATION_NAME)

  const fonts = {
    regular: await doc.embedFont(StandardFonts.Helvetica),
    bold: await doc.embedFont(StandardFonts.HelveticaBold),
  }

  let signature = null
  if (record.signatureImage) {
    try {
      signature = await doc.embedPng(record.signatureImage)
    } catch {
      // A certificate missing its signature image is still worth producing; the
      // ruled signature line prints empty.
      signature = null
    }
  }

  const l = new Layout(doc, fonts)

  l.text('Residential Tenancies Regulations 2021', {
    size: 9.5,
    bold: true,
    color: palette.accent,
    align: 'center',
  })
  l.text('Electrical Safety Check – Report', {
    size: 15,
    bold: true,
    color: palette.accent,
    align: 'center',
  })
  l.y += 10

  // Reference strip
  const stripHeight = 26
  l.rect(MARGIN_X, l.y, CONTENT_W, stripHeight, {
    fill: palette.accentSoft,
    border: palette.line,
  })
  const strip = [
    ['Certificate', reference],
    ['Inspection date', formatDisplayDate(record.inspectionDate)],
    ['Next inspection due', formatDisplayDate(record.nextInspectionDue)],
  ]
  strip.forEach(([label, value], index) => {
    const width = CONTENT_W / 3
    const x = MARGIN_X + 10 + index * width
    l.text(label.toUpperCase(), {
      size: 6.5,
      color: palette.muted,
      x,
      maxWidth: width - 10,
      top: l.y + 6,
    })
    l.text(value, { size: 9, bold: true, x, maxWidth: width - 10, top: l.y + 14 })
  })
  l.y += stripHeight + 12

  l.text(REGULATION_PREAMBLE, { size: 7.5, color: palette.muted })
  l.y += 6

  sectionHeading(l, 'A. Installation address')
  fieldRow(l, [
    { label: 'Address', value: record.address, flex: 2 },
    {
      label: 'Date of previous safety check',
      value: record.previousCheckDate
        ? formatDisplayDate(record.previousCheckDate)
        : 'None recorded',
    },
  ])

  CHECKLIST.forEach((section, index) => {
    checklistBlock(l, section, record.checklist[section.section] || {}, {
      showLetter: index === 0 || CHECKLIST[index - 1].letter !== section.letter,
      showLegend: index === 0,
    })
  })

  rcdTable(l, record.rcdTests)

  const failures = record.rcdTests.filter(
    (test) => test.pushButtonTest === 'FAIL' || test.timeTest === 'FAIL',
  )
  if (failures.length > 0) failCallout(l, failures.length)

  smokeAlarms(l, record)
  observations(l, record.observations)
  await certification(l, record, signature)

  runningFurniture(l, data)

  return doc.save()
}

/** Renders and hands the file to the browser. */
async function downloadCertificate(record, { inline = false } = {}) {
  const bytes = await renderCertificate(record)
  const reference = certificateReference(record.serial, record.inspectionDate)
  const blob = new Blob([bytes], { type: 'application/pdf' })
  const url = URL.createObjectURL(blob)

  if (inline) {
    window.open(url, '_blank')
    // Give the new tab time to take the blob before it is revoked.
    setTimeout(() => URL.revokeObjectURL(url), 60_000)
    return
  }

  const link = document.createElement('a')
  link.href = url
  link.download = certificateFilename(reference, record.address)
  document.body.appendChild(link)
  link.click()
  link.remove()
  URL.revokeObjectURL(url)
}

  return {
    renderCertificate,
    downloadCertificate,
  }
})

__def('signature.js', function (__req) {
/**
 * Draw-to-sign capture.
 *
 * The legacy form took the signature as a line of typed text, which is not
 * meaningfully a signature on a document certifying electrical safety. This
 * records the actual strokes and hands back a PNG data URL for the PDF.
 */

function createSignaturePad(canvas, { onChange }) {
  let drawing = false
  let hasStrokes = false

  // Size the backing store to the device pixel ratio so strokes are not blurry
  // on the phones and tablets these get filled in on.
  function resize() {
    const { width, height } = canvas.getBoundingClientRect()
    if (!width || !height) return

    const ratio = window.devicePixelRatio || 1
    const snapshot = hasStrokes ? canvas.toDataURL('image/png') : null

    canvas.width = Math.round(width * ratio)
    canvas.height = Math.round(height * ratio)

    const ctx = canvas.getContext('2d')
    if (!ctx) return
    ctx.scale(ratio, ratio)
    ctx.lineWidth = 2
    ctx.lineCap = 'round'
    ctx.lineJoin = 'round'
    ctx.strokeStyle = '#1c2430'

    if (snapshot) {
      const image = new Image()
      image.onload = () => ctx.drawImage(image, 0, 0, width, height)
      image.src = snapshot
    }
  }

  function positionOf(event) {
    const rect = canvas.getBoundingClientRect()
    return { x: event.clientX - rect.left, y: event.clientY - rect.top }
  }

  function start(event) {
    const ctx = canvas.getContext('2d')
    if (!ctx) return
    // Capture keeps the stroke alive if the pointer leaves the canvas mid
    // signature. It is not essential, and it throws for pointer ids the browser
    // no longer considers active, so a failure must not abort the stroke.
    try {
      canvas.setPointerCapture(event.pointerId)
    } catch {
      // Drawing still works without capture.
    }
    drawing = true
    const { x, y } = positionOf(event)
    ctx.beginPath()
    ctx.moveTo(x, y)
  }

  function move(event) {
    if (!drawing) return
    const ctx = canvas.getContext('2d')
    if (!ctx) return
    const { x, y } = positionOf(event)
    ctx.lineTo(x, y)
    ctx.stroke()
    hasStrokes = true
  }

  function end() {
    if (!drawing) return
    drawing = false
    if (!hasStrokes) return
    onChange(canvas.toDataURL('image/png'))
  }

  function clear() {
    const ctx = canvas.getContext('2d')
    if (!ctx) return
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    hasStrokes = false
    onChange('')
  }

  canvas.addEventListener('pointerdown', start)
  canvas.addEventListener('pointermove', move)
  canvas.addEventListener('pointerup', end)
  canvas.addEventListener('pointerleave', end)
  canvas.addEventListener('pointercancel', end)
  window.addEventListener('resize', resize)
  resize()

  return {
    clear,
    isEmpty: () => !hasStrokes,
  }
}

  return {
    createSignaturePad,
  }
})

__def('sample.js', function (__req) {
/**
 * A fully populated sample certificate.
 *
 * Filling the real form takes a few minutes, which makes it awkward to show
 * someone the register, the certificate page and the PDF. This writes one
 * complete record so all three have something to display.
 *
 * Offered only when certificates are kept in the browser — there is no reason
 * to seed fiction into a real database.
 */

const { CHECKLIST } = __req('catalog.js')
const { addYears, todayDateOnly } = __req('dates.js')
const { createSafetyCheck } = __req('db.js')
const { validateSafetyCheck } = __req('validate.js')
const ADDRESSES = [
  '14 Ballarat Road, Footscray VIC 3011',
  '221B Sydney Road, Brunswick VIC 3056',
  '7/58 Nicholson Street, Coburg VIC 3058',
  '92 Geelong Road, Seddon VIC 3011',
  '3 Rosamond Road, Maidstone VIC 3012',
]

const ELECTRICIANS = [
  { name: 'Brandon Ferry', licence: 'REC 35346' },
  { name: 'Alicia Nguyen', licence: 'REC 41882' },
  { name: 'Marcus Whitfield', licence: 'REC 28104' },
]

/** Draws a plausible signature so the PDF has something real to embed. */
function drawSignature(name) {
  const canvas = document.createElement('canvas')
  canvas.width = 420
  canvas.height = 130

  const ctx = canvas.getContext('2d')
  ctx.strokeStyle = '#1c2430'
  ctx.lineWidth = 2.4
  ctx.lineCap = 'round'
  ctx.lineJoin = 'round'

  // Seed the wobble from the name so each electrician signs consistently.
  let seed = [...name].reduce((sum, c) => sum + c.charCodeAt(0), 0)
  const next = () => {
    seed = (seed * 1103515245 + 12345) % 2147483648
    return seed / 2147483648
  }

  ctx.beginPath()
  ctx.moveTo(24, 90)
  let x = 24
  while (x < 380) {
    const step = 26 + next() * 22
    const peak = 30 + next() * 45
    ctx.quadraticCurveTo(x + step / 2, peak, x + step, 70 + next() * 30)
    x += step
  }
  ctx.stroke()

  // The trailing flourish most signatures end on.
  ctx.beginPath()
  ctx.moveTo(30, 104)
  ctx.quadraticCurveTo(200, 118, 360, 96)
  ctx.lineWidth = 1.6
  ctx.stroke()

  return canvas.toDataURL('image/png')
}

/**
 * Answers every checklist line, mostly checked, with a scattering of N/A and NI
 * so the three states are all visible on the certificate.
 */
function checklist() {
  const answers = {}
  for (const section of CHECKLIST) {
    answers[section.section] = {}
    section.items.forEach((item, index) => {
      const every = index % 7
      answers[section.section][item.key] =
        every === 3 ? 'NOT_APPLICABLE' : every === 5 ? 'NOT_INCLUDED' : 'INCLUDED'
    })
  }
  return answers
}

function pick(list, offset) {
  return list[offset % list.length]
}

/**
 * Writes one sample certificate and returns its id.
 *
 * `offset` varies the address, electrician and inspection date so repeated
 * calls build a register worth looking at rather than five identical rows.
 */
async function addSampleCertificate(offset = 0) {
  const electrician = pick(ELECTRICIANS, offset)
  const inspection = addYears(todayDateOnly(), 0)

  // Walk the inspection back a few days per sample so the register sorts.
  const inspectionDate = new Date(inspection)
  inspectionDate.setUTCDate(inspectionDate.getUTCDate() - offset * 11)
  const inspected = inspectionDate.toISOString().slice(0, 10)

  const failing = offset % 3 === 1

  const payload = {
    address: pick(ADDRESSES, offset),
    previousCheckDate: addYears(inspected, -2),
    checklist: checklist(),
    rcdTests: [
      { circuit: 'Power outlets — kitchen and living', pushButtonTest: 'PASS', timeTest: 'PASS' },
      { circuit: 'Power outlets — bedrooms', pushButtonTest: 'PASS', timeTest: 'PASS' },
      {
        circuit: 'Lighting — ground floor',
        pushButtonTest: failing ? 'FAIL' : 'PASS',
        timeTest: 'PASS',
      },
      { circuit: 'Lighting — upper floor', pushButtonTest: 'PASS', timeTest: 'NA' },
      { circuit: 'Air conditioning', pushButtonTest: 'PASS', timeTest: 'PASS' },
      { circuit: 'Solar inverter isolator', pushButtonTest: 'PASS', timeTest: 'PASS' },
    ],
    smokeAlarmsCompliant: !failing,
    smokeAlarmDueDate: addYears(inspected, 1),
    observations: failing
      ? 'Ground floor lighting RCD did not trip on the push button test and is recommended for ' +
        'replacement before the property is re-let. Hallway smoke alarm is beyond its ten year ' +
        'service life and was not replaced during this visit.'
      : 'No defects found. All circuits tested within tolerance.',
    electricianName: electrician.name,
    licenceNumber: electrician.licence,
    inspectionDate: inspected,
    nextInspectionDue: addYears(inspected, 2),
    signatureImage: drawSignature(electrician.name),
    signedDate: inspected,
  }

  // Sample data goes through the same rules as anything an electrician types,
  // so a sample can never be something the form itself would have rejected.
  const result = validateSafetyCheck(payload)
  if (!result.ok) {
    throw new Error(`The sample certificate is not valid: ${JSON.stringify(result.fieldErrors)}`)
  }

  return createSafetyCheck(result.values)
}

  return {
    addSampleCertificate,
  }
})

/**
 * The register: every certificate issued, newest inspection first, with search.
 *
 * The legacy PHP page had no register at all — a certificate went into the
 * `safety` table and was never shown again.
 */

const { ORGANISATION_NAME } = __req('config.js')
const { formatDisplayDate, parseDateOnly, todayDateOnly } = __req('dates.js')
const { getSafetyCheck, isConfigured, isDurable, listSafetyChecks, storageFallback } = __req('db.js')
const { el, errorPanel, ensureStorageBanner, notice, pageHref, param, qs, render } = __req('dom.js')
const { downloadCertificate } = __req('pdf.js')
const { certificateReference } = __req('reference.js')
let results = null
let search = ''
let banner = null
let wired = false

/**
 * Renders the register into the markup already on the page.
 *
 * Called once per page load in the multi-page build, and again on every hash
 * change in the single-file one, so anything that attaches a listener has to be
 * guarded.
 */
function init() {
  results = qs('#results')
  search = param('q') || ''

  qs('[data-organisation]').textContent = ORGANISATION_NAME
  qs('input[name="q"]').value = search

  if (!wired) {
    wired = true
    // The single-file build has no second page to GET, so searching moves the
    // hash and lets the router re-enter here.
    qs('#register-search').addEventListener('submit', (event) => {
      event.preventDefault()
      window.location.href = pageHref('register', { q: qs('input[name="q"]').value })
    })
  }

  if (!isDurable) {
    banner = ensureStorageBanner()
  }

  if (!isConfigured()) {
    render(
      results,
      errorPanel('Open js/config.js and fill in your Supabase project URL and anon key.'),
    )
    return
  }

  load()
}

async function load() {
  try {
    const checks = await listSafetyChecks(search)
    render(results, checks.length === 0 ? emptyState() : table(checks))
    if (storageFallback.active && banner) banner.noteFallback(storageFallback.reason, storageFallback.persists)
  } catch (error) {
    render(results, errorPanel(error.message))
  }
}

function emptyState() {
  const actions = el('div', {
    style: 'display:flex;gap:.5rem;justify-content:center;margin-top:1rem;flex-wrap:wrap',
  }, [
    el('a', { class: 'btn btn--primary', href: pageHref('new') }, 'Start a safety check'),
    // Filling the form takes a few minutes, which makes it awkward to show
    // anyone the register. Seeding is offered only for browser storage.
    !search && !isDurable ? sampleButton() : null,
  ])

  return notice(
    search ? `No certificates match “${search}”.` : 'No certificates have been issued yet.',
    actions,
  )
}

function sampleButton() {
  const button = el('button', { class: 'btn', type: 'button' }, 'Add sample certificates')

  button.addEventListener('click', async () => {
    button.disabled = true
    button.textContent = 'Adding…'
    try {
      const { addSampleCertificate } = __req('sample.js')
      for (let i = 0; i < 4; i++) await addSampleCertificate(i)
      await load()
    } catch (error) {

      button.textContent = 'Failed'
      button.disabled = false
    }

  return button

    el('th', {}, 'Inspected'),
    el('th', {}, 'Next due'),

  ]))

  const body = el('tbody', {}, checks.map((check) => {

    button.textContent = 'Building…'

      window.setTimeout(() => {
        button.textContent = original
      }, 3000)
    } finally {
      button.disabled = false
    }
  })

  return button
}

  return {
    init,
  }
})
