<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety check register — Electrical Safety Check</title>
<meta name="description" content="Register of Electrical Safety Check certificates issued under the Residential Tenancies Regulations 2021.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-header no-print">
  <div class="site-header__inner">
    <a class="brand" href="index.html">
      <span class="brand__name" data-organisation>Electrical Safety Check</span>
      <span class="brand__sub">Electrical Safety Check register</span>
    </a>
    <a class="btn btn--primary" href="new.html">New safety check</a>
  </div>
</header>

<main class="wrap stack">
  <div class="toolbar">
    <div>
      <h1 class="page-title">Safety check register</h1>
      <p class="muted">Every certificate issued, newest inspection first.</p>
    </div>
    <form class="no-print" method="get" action="index.html">
      <input type="text" name="q" aria-label="Search the register"
             placeholder="Search address, electrician or licence">
      <button class="btn" type="submit">Search</button>
    </form>
  </div>

  <div id="results">
    <p class="muted">Loading the register…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module" src="js/register.js"></script>

</body>
</html>
